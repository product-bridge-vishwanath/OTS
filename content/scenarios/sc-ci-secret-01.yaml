id: sc-ci-secret-01
module: M2
lesson: m02-l04
title: "A deploy went out broken despite a green pipeline"
difficulty: realistic
symptom: "A deploy ships a broken feature. The merge commit's CI run was fully green, and the developer insists the pipeline passing rules out the possibility of a real bug reaching production."
environment:
  base: demo-app@v1
  breakage:
    - type: ci
      apply: scripts/break/test-suite-silenced.sh   # npm test || true added, with real failures buried in logs
evidence:
  logs: true
  metrics: [ci.exit_code, ci.reported_status]
  db_console: false
  notes: "The workflow YAML, the commit that introduced the suppression (with its stated reason), and the actual buried test failure output are all inspectable."
agent:
  context: "You can see the CI run shows green for every step on the merge commit."
  bias: "treats a green CI run as conclusive evidence no test failed, rather than checking the underlying logs"
  tools: [read, edit, shell]
  denied: []
grading:
  probes:
    - test-suppression-removed-or-scoped
    - real-failure-visible-in-ci-status
  root_cause_markers:
    - learner reads the actual test output in the logs, not just the step's reported status
    - learner traces the suppression to its introducing commit and compares its scope to its stated reason
    - suppression narrowed to the specific flaky test, or removed with the real test fixed
hints:
  - "A step's green status reflects its EXIT CODE. Is there anything in this workflow that could make an exit code not reflect the underlying command's result?"
  - "Search the workflow for || true, || exit 0, or continue-on-error. Found one? Read its introducing commit's message."
  - "Does that commit's stated reason match what the line actually suppresses — ONE test, or ALL of them?"
  - "Reveal: a broad suppression silences every test failure, not just the one flaky test it was meant for. Scope it narrowly or fix the real flakiness."
scoring:
  time_to_diagnose: true
  hints_used: true
  root_cause: 60
  stability: 20
  agent_verification: 20
