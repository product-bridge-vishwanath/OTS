id: sc-config-vs-secret-01
module: M4
lesson: m04-l05
title: "The kill switch that took eleven minutes to flip"
difficulty: realistic
symptom: "During a real payment provider outage, flipping an env-var kill switch takes 11 minutes to take effect because it requires a redeploy — by which time the outage has already resolved."
environment:
  base: demo-app@v1
  breakage:
    - type: config
      apply: scripts/break/env-var-kill-switch.sh   # PAYMENTS_ENABLED implemented as a restart-bound env var
    - type: provider
      apply: scripts/break/provider-outage-window.sh
evidence:
  logs: true
  metrics: [deploy.duration, flag.flip_to_effective_seconds]
  db_console: true
agent:
  context: "You flipped the environment variable and the dashboard confirmed it saved."
  bias: "assumes the flag took effect immediately because the save was confirmed"
  tools: [read, edit, shell]
  denied: []
grading:
  probes:
    - flag-flips-without-redeploy
    - flag-checked-per-request-or-short-cache
  root_cause_markers:
    - learner identifies the env-var delivery mechanism (restart-bound) as the actual defect
    - flag moved to a database-backed or dedicated flag-service mechanism
    - env-var version kept as an independent fallback, not removed
  symptom_only_markers:
    - redeploy process sped up instead of changing the flag mechanism
    - flag removed entirely with no replacement kill switch
hints:
  - "The dashboard said 'saved'. Does 'saved' mean 'in effect' for an environment variable?"
  - "What does it take for a running process to see a NEW value of an env var it read at startup?"
  - "A kill switch's entire value is one property. What is it, and does this mechanism deliver it?"
  - "Reveal: env vars are restart-bound by nature. Move the switch to something checked per-request, and keep the env var as a slower fallback."
scoring:
  time_to_diagnose: true
  hints_used: true
  root_cause: 60
  stability: 20
  agent_verification: 20
