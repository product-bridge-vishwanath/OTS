# CI for the platform site: content lint + production build on every push
# and PR. This is the real workflow referenced by M2.4 — the lesson's
# anatomy walkthrough matches this file line for line.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint content
        run: npm run lint:content

      - name: Build
        run: npm run build
